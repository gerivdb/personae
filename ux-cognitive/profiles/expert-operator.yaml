# Expert Operator

## Metadata

- **profile_id**: expert-operator
- **display_name**: Expert Operator
- **description**: Utilisateur expert maîtrisant les raccourcis clavier et les workflows avancés. Haute capacité cognitive, faible besoin d'guidage.
- **persona_ref**: null
- **tags**:
