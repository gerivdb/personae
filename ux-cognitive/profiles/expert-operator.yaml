## Cognitive Attributes

- **cognitive_load**: high
  - _note_: Peut traiter simultanément plusieurs flux d'information et basculer entre contextes sans perte.

- **shortcuts**: extensive
  - _note_: Utilise intensivement les raccourcis clavier, les macros, et les commandes en ligne.

- **error_tolerance**: high
  - _note_: Corrige ses erreurs rapidement et sait revenir en arrière sans perdre le fil.

- **info_density**: high
  - _note_: Préfère des interfaces denses avec peu de fioritures, toutes les informations pertinentes visibles.

- **iteration_cycle**: fast
  - _note_: Itère rapidement, teste plusieurs hypothèses en séquence, valide par lots.

## UX Implications

- **preferred_ui_patterns**:
  - command-palette
  - keyboard-first-navigation
  - dense-data-tables
  - split-view-editors
- **avoid_ui_patterns**:
  - wizard-sequential
  - large-hero-banners
  - hand-holding-tooltips
- **onboarding_strategy**: self_service
- **training_time_estimate**: < 1 day

